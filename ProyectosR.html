<style>
    input, select

        width: 20vw;
    }
    #txtConfirmAlert, #txtConfirmPasswordAlert, #txtPasswordAlert, #txtEmailAlert
    {
        color: red;
    }

    table {
            width: 90%;
            border-collapse: collapse;

        }

            border: 1px solid #ccc;

<body>
