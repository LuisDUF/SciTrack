<!DOCTYPE html>
<html lang="es">
<head>
    <script src="main.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scitrack</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
        }

        h2 { 
            margin-top: 40px; 
        }
        
        form, table { 
            max-width: 600px; 
            margin: 20px auto; 
        }

        label, input, select, button { 
            display: block; 
            width: 100%; 
            margin-bottom: 10px; 
        }

        button { background-color: #4CAF50; 
            color: white; padding: 10px; 
            border: none; 
            cursor: pointer; 
        }

        button:hover { 
            background-color: #45a049; 
        }

        table { 
            width: 100%; 
            border-collapse: collapse;
            margin-top: 20px; 
        }

        th, td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: center;
        }

        th { 
            background-color: #f2f2f2; 
        }
        
        h2 {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Gestión de Equipos</h1>

    <h2>Crear Nuevo Equipo</h2>
    <form id="formCrearEquipo">
        <label>Nombre del Equipo:</label>
        <input type="text" id="inputNombre" placeholder="Ingrese el nombre del equipo" required>
        <label>Seleccionar Asesor:</label>
        <select id="selectAsesor" required>
            <option value="none">Seleccione un asesor</option>
        </select>

        <button type="submit">Crear Equipo</button>
    </form>

    <h2>Unirse a un equipo existente</h2>
    <table>
        <thead>
            <tr>
                <th>Nombre del Equipo</th>
                <th>Número de participantes</th>
                <th>Asesor</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            <!-- Aquí se llenarán los equipos dinámicamente -->
        </tbody>
    </table>
</body>
</html>
