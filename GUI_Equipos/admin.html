<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Equipos - SCITrack</title>
    <script src="scripts/admin.js" defer></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
        }

        h1 { 
            text-align: center; 
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
        }

        th, td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: center; 
        }

        th { 
            background-color: #f2f2f2; 
        }

        input{
            display:block;
            width:450px;
            border-collapse: collapse;
        }


        .delete { 
            background-color: #d9534f;
            color: white; 
            padding: 5px 10px; 
            border: none; 
            cursor: pointer;
        }

        .delete:hover { 
            background-color: #c9302c; 
        }

        
        .edit { 

            background-color: #0078bd;
            color: white; 
            padding: 5px 10px; 
            border: none; 
            cursor: pointer;
        }

        .edit:hover { 
            background-color: #01578a; 
        }

    </style>
</head>
<body>
    <h1>Gestión de Equipos</h1>
    <h2>Lista de Equipos</h2>
    <h3>Buscar Equipos</h3>
    <input type="text" id="searchInput" placeholder="Buscar equipo (ID del equipo, nombre del lider o del asesor)" onkeyup="buscarEquipos()">

    <table>
        <thead>
            <tr>
                <th>ID del equipo</th>
                <th>Nombre del Líder</th>
                <th>Número de Participantes</th>
                <th>Asesor</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tablaEquipos">
            
        </tbody>
    </table>
</body>
</html>
