<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización de Fases</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2>Fases del Concurso</h2>
    <table id="tabla-fases">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Modalidad</th>
                <th>Fecha de Inicio</th>
                <th>Fecha de Fin</th>
                <th>Descripción</th>
                <th>Ubicación</th>
            </tr>
        </thead>
        <tbody>
            <!-- Aquí se insertarán las fases -->
        </tbody>
    </table>

    <script>
        // URL de tu API (ajústala según tu caso)
        const API_URL = 'https://tu-api.com/fases';

        async function cargarFases() {
            try {
                const respuesta = await fetch(API_URL);
                const fases = await respuesta.json();

                const cuerpoTabla = document.querySelector('#tabla-fases tbody');
                cuerpoTabla.innerHTML = ''; // Limpiar antes de insertar

                fases.forEach(fase => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>${fase.nombre}</td>
                        <td>${fase.modalidad}</td>
                        <td>${fase.fecha_inicio}</td>
                        <td>${fase.fecha_fin}</td>
                        <td>${fase.descripcion}</td>
                        <td>${fase.ubicacion}</td>
                    `;
                    cuerpoTabla.appendChild(fila);
                });
            } catch (error) {
                console.error('Error al cargar las fases:', error);
            }
        }

        // Ejecutar al cargar la página
        window.onload = cargarFases;
    </script>
</body>
</html>
