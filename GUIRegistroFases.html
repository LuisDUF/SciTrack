<!DOCTYPE html>
<html lang="en-CA">
<head>
    <script src="registro.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Fases</title>
</head>
<body>
    <h2>Registro de Fases del Concurso</h2>
    
        <label for="nombre">Nombre:</label>
        <input type="text" id="inputNombre" name="nombre" maxlength="45" required><br><br>

        <label for="modalidad">Modalidad:</label>
        <input type="text" id="inputModalidad" name="modalidad" maxlength="45" required><br><br>

        <label for="fechaInicio">Fecha de Inicio:</label>
        <label>Año:</label>
        <input type="number" id="anioIn" name="anio" min="1900" max="2100">

        <label>Mes:</label>
        <input type="number" id="mesIn" name="mes" min="1" max="12">

        <label>Día:</label>
        <input type="number" id="diaIn" name="dia" min="1" max="31"><br><br>

        <label for="fechaFin">Fecha de Fin:</label>
        <label>&nbsp;&nbsp;&nbsp;&nbsp;Año:</label>
        <input type="number" id="anioFn" name="anio" min="1900" max="2100">

        <label>Mes:</label>
        <input type="number" id="mesFn" name="mes" min="1" max="12">

        <label>Día:</label>
        <input type="number" id="diaFn" name="dia" min="1" max="31"><br><br>

        <label for="descripcion">Descripción:</label>
        <textarea id="inputDescripcion" name="inputDescripcion" maxlength="45"  rows="4" cols="50" required></textarea><br><br>

        <label for="ubicacion">Ubicación:</label>
        <input type="text" id="inputIdUbicacion" name="idUbicacion" required placeholder="idUbicacion"><br><br>

        <button id="btnConfirm" type="submit">Registrar Fase</button>
    
</body>
</html>
