<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Archivos - SCITrack</title>
    <script src="scripts/Listar_archivos.js" defer></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
        }

        h1 { 
            text-align: center; 
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
        }

        th, td { 
            justify-content: center;
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: center; 
        }

        th { 
            background-color: #f2f2f2; 
        }

        input{
            display:block;
            width:450px;
            border-collapse: collapse;
        }


        .delete { 
            background-color: #d9534f;
            color: white; 
            padding: 5px 10px; 
            border: none; 
            cursor: pointer;
        }

        .delete:hover { 
            background-color: #c9302c; 
        }

        
        .boton-con-imagen {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 40px;
        }

        .imagen-boton {
            width: 30px;  /* Ajusta el tamaño de la imagen */
            height: 30px; /* Ajusta el tamaño de la imagen */
            
        }
    </style>
</head>
<body>
    <h1>Gestión de Archivos</h1>
    <h2>Lista de Archivos</h2>
    <h3>Buscar Archivos</h3>

    <input type="text" id="searchInput" placeholder="Buscar archivo (ID del archivo o nombre)" onkeyup="buscarArchivo()">

    <table>
        <thead>
            
        </thead>
        <tbody id="tablaAdrchivos">
            
        </tbody>
    </table>
</body>
</html>
