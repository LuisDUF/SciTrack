<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subir PDF</title>
  <script defer src="scripts/main.js"></script>
  <style>
    .notas{
      color: red;
    }
  </style>
</head>
<body>
  <h1>Subir archivo PDF</h1>

  <p>Selecciona un archivo PDF:</p>
  <p class="notas">*Nota: El tamaño de los archivos debe ser menor de 66 kilobytes.</p>
  <input type="file" id="inputPDF" accept="application/pdf" />

  <h3>Detalles del archivo</h3>
  <p>Nombre: <span id="nombreArchivo">--</span></p>
  <p>Tamaño: <span id="tamanoArchivo">--</span></p>
  <p>Fecha de ingreso: <span id="fechaIngreso">--</span></p>

  <br><br>
  <button id="btnSubir">Subir archivo</button>

  <!-- Aquí va el mensaje de confirmación o error -->
  <div id="txtConfirmAlert" style="color: red; margin-top: 10px;"></div>
</body>
</html>
