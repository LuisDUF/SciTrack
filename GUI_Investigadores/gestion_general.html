<!DOCTYPE html>
<head> 
    <script src="scripts/gestionGeneral.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scitrack</title>
</head>
<header>
  <h1>Gestión de datos institucionales [Investigador]</h1>
</header>

<style>
    body
    {
      font-family: Verdana, Geneva, Tahoma, sans-serif
    }

    blo
    {
      pointer-events: none;
      filter: blur(10px) saturate(0.2);
    }

    input, select
    {
        width: 18vw;
    }
    #txtConfirmAlert, #txtConfirmPasswordAlert, #txtPasswordAlert, #txtEmailAlert
    {
        color: red;
    }
    .loading
    {
      filter: blur(10px);
      pointer-events: none;
    
    }
    .loading_gif
    {
      opacity: 0;
      pointer-events: none;
      position: fixed;
      width: 4vmax;
      top: 47%;
      left: 47%;
    }
</style>

<loading>
  <img src="../Resources/loading_scitrack.gif" class="loading_gif" id="loading_gif">
</loading>
<body>
  <block_by_loading>
  <p>Grados de Estudio:</p>
  <select id="selectGrado">
    <option value="none">---</option>
  </select> <br><br>
  <input type="text" id="inputGrado" placeholder="..." />
  <button id="btnAddGrd">Agregar</button> <button id="btnConfirmGrd">Editar</button> <button id="btnConfirmDelGrd">Eliminar</button>

  <p>Areas de Conocimiento:</p>
  <select id="selectArea">
    <option value="none">---</option>
  </select> <br><br>
  <input type="text" id="inputArea" placeholder="..." />
  <button id="btnAddAre">Agregar</button> <button id="btnConfirmAre">Editar</button> <button id="btnConfirmDelAre">Eliminar</button>

  </block_by_loading>
</body>
