<!DOCTYPE html>
<head> 
    <script src="scripts/registrar.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scitrack</title>
</head>
<header>
  <h1>Registro de Investigador</h1>
</header>

<style>
    body
    {
      font-family: Verdana, Geneva, Tahoma, sans-serif
    }

    blo
    {
      pointer-events: none;
      filter: blur(10px) saturate(0.2);
    }

    input, select
    {
        width: 20vw;
    }
    #txtConfirmAlert, #txtConfirmPasswordAlert, #txtPasswordAlert, #txtEmailAlert
    {
        color: red;
    }
    .loading
    {
      filter: blur(10px);
      pointer-events: none;
    
    }
    .loading_gif
    {
      opacity: 0;
      pointer-events: none;
      position: fixed;
      width: 4vmax;
      top: 47%;
      left: 47%;
    }
</style>

<loading>
  <img src="../Resources/loading_scitrack.gif" class="loading_gif" id="loading_gif">
</loading>
<body>
  <block_by_loading>
  <p>Disciplina:</p>
  <select id="selectDisciplina">
    <option value="none">---</option>
  </select>

  <p>Institucion:</p>
  <select id="selectInstitucion">
    <option value="none">---</option>
  </select>

  <p>Grado de Estudios:</p>
  <select id="selectGrado">
    <option value="none">---</option>
  </select>

  <p>Genero:</p>
  <select id="selectGenero">
    <option value="none">---</option>
  </select>

  <p>Calle:</p>
  <input type="text" id="inputCalle" placeholder="Ingrese el nombre de la calle..." />

  <p>Número:</p>
  <input type="number" id="inputNumero" placeholder="Ingrese el numero exterior..." />

  <p>Código Postal:</p>
  <input type="number" id="inputCodPos" placeholder="Ingrese el código postal..." />

  
  <br><br>
  <button id="btnConfirm">Confirmar</button>
  <p id="txtConfirmAlert"></p>
  </block_by_loading>
</body>
