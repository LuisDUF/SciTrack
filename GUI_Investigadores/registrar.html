<!DOCTYPE html>
<head> 
    <script src="scripts/registrar.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scitrack</title>
</head>
<header>
  <h1>Registro de Investigador</h1>
</header>

<style>
    body
    {
      font-family: Verdana, Geneva, Tahoma, sans-serif
    }

    blo
    {
      pointer-events: none;
      filter: blur(10px) saturate(0.2);
    }

    input, select
    {
        width: 20vw;
    }
    #txtConfirmAlert, #txtConfirmPasswordAlert, #txtPasswordAlert, #txtEmailAlert
    {
        color: red;
    }
    .loading
    {
      filter: blur(10px);
      pointer-events: none;
    
    }
    .loading_gif
    {
      opacity: 0;
      pointer-events: none;
      position: fixed;
      width: 4vmax;
      top: 47%;
      left: 47%;
    }
</style>

<loading>
  <img src="../Resources/loading_scitrack.gif" class="loading_gif" id="loading_gif">
</loading>
<body>
  <block_by_loading>
 

  <p>Nombre:</p>
  <input type="text" id="inputNombre" placeholder="Ingrese su nombre..." />

  <p>Apellido paterno:</p>
  <input type="text" id="inputApellidoPaterno" placeholder="Ingrese su apellido paterno..." />
  
  <p>Apellido materno:</p>
  <input type="text" id="inputApellidoMaterno" placeholder="Ingrese su apellido materno..." />

  <p>Correo:</p>
  <input type="text" id="inputCorreo" placeholder="Ingrese su correo..." />

  <p>Telefono:</p>
  <input type="number" id="inputNumbers" placeholder="Ingrese su numero de telefono..." />

  <p>Edad:</p>
  <input type="number" id="inputEdad" placeholder="Ingrese su edad..." />

  <p>Nacionalidad:</p>
  <select id="selectPais">
    <option value="none">---</option>
  </select>

  <p>Estado:</p>
  <select id="selectEstado">
    <option value="none">---</option>
  </select>

  <p>Municipio:</p>
  <select id="selectMunicipio">
    <option value="none">---</option>
  </select>

  <p>Domicilio:</p>
  <input type="text" id="inputDomicilio" placeholder="Ingrese su domicilio..." />

  <p>CURP:</p>
  <input type="text" id="inputCurp" placeholder="Ingrese su CURP..." />

  <p>RFC:</p>
  <input type="text" id="inputRfc" placeholder="Ingrese su domicilio..." />


  <p>Contraseña:</p>
  <input type="password" id="inputPassword" placeholder="..." />

  <p>Confirmar contraseña:</p>
  <input type="password" id="inputConfirmPassword" placeholder="..." />


  <p>Disciplina:</p>
  <select id="selectDisciplina">
    <option value="none">---</option>
  </select>

  <p>Institucion:</p>
  <select id="selectInstitucion">
    <option value="none">---</option>
  </select>

  <p>Grado de Estudios:</p>
  <select id="selectGrado">
    <option value="none">---</option>
  </select>

  <p>Genero:</p>
  <select id="selectGenero">
    <option value="none">---</option>
  </select>
  
  <br><br>
  <p id="txtConfirmAlert"></p>
  <button id="btnConfirm">Confirmar</button>

  </block_by_loading>
</body>
