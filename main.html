<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .hidden {
            display: none;
        }
    </style>
    <script src="main.js" defer></script>
</head>
<header>
    <h1>Registro de Instituciones </h1>
</header>
<body>



    <h2>Registro de Institución</h2>
    <input type="text" id="inputInstitucion" placeholder="Nombre de la institucion">
    
<br><br>

<button id="btnEnviarInstitucion">Confirmar</button>


    <h2>Registro de dependencias</h2>
    <input type="text" id="inputDependencia" placeholder="Nombre de la dependencia">
    <input type="text" id="inputIdInstitucion" placeholder="Id de la institucion">

<br><br>

<button id="btnEnviarDependencia">Confirmar</button>

    <h3>Lista de Instituciones</h3>
    <ul id="lista-instituciones"></ul>
    
    <h3>Busqueda de dependencias</h3>
    <input type="text" id="inputBusquedaDependencias" placeholder="Id de la Institucion">
    <button id="btnBuscarDependencias">Buscar</button>
    <ul id="lista-dependencias"></ul>
    

</body>
</html>
