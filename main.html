<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Institución</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .hidden {
            display: none;
        }
    </style>
    <script src="main.js" defer></script>
</head>
<body>
    <h2>Registro de Institución</h2>
    <label for="institucion">Nombre de la Institución:</label>
    <input type="text" id="institucion">
    <button onclick="mostrarDependencias()">Continuar</button>

    <div id="dependencias-section" class="hidden">
        <h3>Dependencias</h3>
        <div id="dependencias-container"></div>
        <button onclick="agregarDependencia()">Agregar Dependencia</button>
        <button onclick="subirDatos()">Subir a la Base de Datos</button>
    </div>

    
</body>
</html>
