<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Listado de Calificaciones</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1em;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #f0f0f0;
    }

    input[type="text"] {
      width: 300px;
      padding: 6px;
      margin-bottom: 10px;
    }

    button {
      padding: 6px 12px;
      cursor: pointer;
    }

    .btnEliminar {
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
    }

    .btnEliminar:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>
  <h2>Listado de Calificaciones</h2>
  <input type="text" id="filtroProyecto" placeholder="Buscar por nombre de proyecto..." />

  <table id="tablaCalificaciones">
    <thead>
      <tr>
        <th>Proyecto</th>
        <th>Criterio</th>
        <th>Calificación</th>
        <th>Fase</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="scripts/listar.js"></script>
</body>
</html>
