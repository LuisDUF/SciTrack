<!DOCTYPE html>
<html lang="en-CA">
<head>
    <script src="Scripts/Registro_disciplina_y_areaInv.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Fases</title>
    <style>
        table {
            width: 40%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2>Registro de Area de Conocimiento</h2>
    
        <label for="nombre">Nombre:</label>
        <input type="text" id="inputNombreArea" name="nombre" maxlength="45" required><br><br>

        <button id="btnConfirmArea" type="submit">Registrar Area</button>
    
        <h2>Registro de Disciplina</h2>
    
        <label for="nombre">Nombre:</label>
        <input type="text" id="inputNombreDis" name="nombre" maxlength="45" required><br><br>
        <label for="nombre">Nombre de la Subdisciplina:</label>
        <input type="text" id="inputNombreSubdis" name="nombre" maxlength="45" required><br><br>
        <label for="nombre">Area de Conocimiento:</label>
        <input type="text" id="inputIdArea" name="nombre" maxlength="45" placeholder="id Area de Conocimiento" required><br><br>

        <button id="btnConfirmDis" type="submit">Registrar Area</button>

        <h2>Areas de Conocimiento</h2>
        <table id="tabla-Areas">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nombre</th>
                
            </tr>
        </thead>
        <tbody>
            <!-- Aquí se insertarán las fases -->
        </tbody>
        </table>

        <h2>Disciplinas</h2>
        <table id="tabla-Disciplinas">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nombre</th>
                <th>Subdisciplina</th>
                <th>Area de Conocimiento</th>

            </tr>
        </thead>
        <tbody>
            <!-- Aquí se insertarán las fases -->
        </tbody>
        </table>

</body>
</html>
